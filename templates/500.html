<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .box {
            max-width: 560px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
        }
        h1 { color: #006633; font-size: 1.25em; margin-top: 0; }
        p { line-height: 1.5; }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Error interno del servidor</h1>
        <p>La aplicación encontró un problema al procesar la solicitud.</p>
        <p>Revise los logs del contenedor (<code>docker logs validador-xm-qe</code>) y que el montaje DFS esté activo.</p>
    </div>
</body>
</html>
